[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["server/**/*.py", "scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts add the repository root before importing the server package.
"scripts/*.py" = ["E402"]

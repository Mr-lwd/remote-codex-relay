name: 功能建议
description: 描述使用场景和希望改善的体验
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 目前哪一步不方便？请使用演示数据，不要包含个人信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 可以同时说明已尝试的替代方案。
    validations:
      required: true

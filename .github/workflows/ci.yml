name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run format:check
      - run: ruff check server scripts tests
      - run: ruff format --check server scripts tests
      - run: python -m pytest
      - run: npm run build
      - run: python scripts/doctor.py --skip-codex
      - run: python scripts/release.py --check
      - if: matrix.python == '3.12'
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: browser-smoke
          path: runtime/browser-smoke/
          if-no-files-found: ignore

name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run format:check
      - run: ruff check server scripts tests
      - run: ruff format --check server scripts tests
      - run: python -m pytest
      - run: npm run build
      - run: python scripts/doctor.py --skip-codex
      - run: python scripts/release.py --check --git-check --history
      - if: matrix.python == '3.12'
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
          python tests/manager_smoke.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: browser-smoke
          path: |
            runtime/browser-smoke/
            runtime/manager-smoke/
          if-no-files-found: ignore
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('package.json'))['version']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Tag does not match package.json version')
          PY
      - run: python scripts/release.py --git-check --history
      - uses: actions/upload-artifact@v4
        with:
          name: codex-relay-source
          path: |
            output/releases/*.zip
            output/releases/SHA256SUMS
          if-no-files-found: error
